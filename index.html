<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2 Anos ❤️</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 25px;
      width: 100%;
      max-width: 700px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      position: relative;
      z-index: 2;
      animation: fadeIn 1.5s ease;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .subtitle {
      font-size: 1.2rem;
      margin-bottom: 25px;
      opacity: 0.9;
    }

    .timer {
      font-size: 1.5rem;
      margin-bottom: 30px;
      font-weight: bold;
    }

    .quote {
      font-size: 1.2rem;
      font-style: italic;
      margin-top: 20px;
      line-height: 1.8;
      min-height: 80px;
    }

    button {
      margin-top: 30px;
      padding: 14px 28px;
      border: none;
      border-radius: 999px;
      background: white;
      color: #ff4f81;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      background: #ffe4ec;
    }

    .heart {
      position: absolute;
      color: rgba(255,255,255,0.7);
      font-size: 24px;
      animation: float 8s linear infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      100% {
        transform: translateY(-100px) scale(1.2);
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media(max-width: 600px){
      h1 {
        font-size: 2rem;
      }

      .timer {
        font-size: 1.1rem;
      }

      .quote {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>❤️ Feliz 2 Anos ❤️</h1>

    <p class="subtitle">
      Dois anos vivendo os melhores momentos da minha vida ao seu lado.
    </p>

    <div class="timer" id="timer"></div>

    <p class="quote" id="quote">
      Carregando mensagem romântica...
    </p>

    <button onclick="newQuote()">
      Nova Mensagem 💌
    </button>
  </div>

  <script>
    // DATA DO NAMORO
    // ALTERE AQUI
    const startDate = new Date('2024-05-09');

    function updateTimer() {
      const now = new Date();
      const diff = now - startDate;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);

      document.getElementById('timer').innerHTML = `
        Estamos juntos há <br>
        ${days} dias, ${hours} horas e ${minutes} minutos ❤️
      `;
    }

    setInterval(updateTimer, 1000);
    updateTimer();

    // API DE FRASES
    async function newQuote() {
      try {
        const response = await fetch('https://api.quotable.io/random?tags=love');
        const data = await response.json();

        document.getElementById('quote').innerHTML = `
          “${data.content}”<br><br>
          — ${data.author}
        `;
      } catch (error) {
        document.getElementById('quote').innerHTML = `
          “Você é a melhor parte da minha vida. ❤️”
        `;
      }
    }

    newQuote();

    // CORAÇÕES FLUTUANDO
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '❤';

      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
      heart.style.fontSize = (Math.random() * 20 + 10) + 'px';

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 8000);
    }

    setInterval(createHeart, 300);
  </script>

</body>
</html>
