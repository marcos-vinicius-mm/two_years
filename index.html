<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>2 Anos ❤️</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{

      height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      overflow:hidden;

      color:white;
      text-align:center;

      padding:20px;

      background-image:
      linear-gradient(
        rgba(20,0,40,0.7),
        rgba(20,0,40,0.7)
      ),
      url('./img/00.jpg');

      background-size:cover;
      background-position:center;

      transition:background-image 1.5s ease;

    }

    .card{

      background:rgba(255,255,255,0.12);

      backdrop-filter:blur(10px);

      padding:40px;

      border-radius:25px;

      width:100%;
      max-width:900px;

      box-shadow:0 8px 30px rgba(0,0,0,0.3);

      position:relative;

      z-index:2;

      animation:fadeIn 1.5s ease;

      max-height:90vh;

      overflow-y:auto;

    }

    .card::-webkit-scrollbar{
      width:8px;
    }

    .card::-webkit-scrollbar-thumb{
      background:#ffffff44;
      border-radius:999px;
    }

    h1{
      font-size:3rem;
      margin-bottom:15px;
    }

    .subtitle{
      font-size:1.2rem;
      margin-bottom:25px;
      opacity:0.9;
      line-height:1.6;
    }

    .timer{
      font-size:1.4rem;
      margin-bottom:30px;
      font-weight:bold;
      line-height:1.7;
    }

    .quote{
      font-size:1rem;
      line-height:1.8;
      margin-top:20px;
    }

    .nasa-image{

      width:100%;

      max-height:350px;

      object-fit:cover;

      border-radius:20px;

      margin-bottom:20px;

      box-shadow:0 8px 25px rgba(0,0,0,0.4);

    }

    button{

      margin-top:30px;

      padding:14px 28px;

      border:none;

      border-radius:999px;

      background:white;

      color:#7b2cbf;

      font-size:1rem;

      cursor:pointer;

      font-weight:bold;

      transition:0.3s;

    }

    button:hover{

      transform:scale(1.05);

      background:#efe3ff;

    }

    .heart{

      position:absolute;

      color:rgba(255,255,255,0.7);

      font-size:24px;

      animation:float 8s linear infinite;

      pointer-events:none;

      z-index:1;

    }

    @keyframes float{

      0%{
        transform:translateY(100vh) scale(0.5);
        opacity:0;
      }

      10%{
        opacity:1;
      }

      100%{
        transform:translateY(-100px) scale(1.2);
        opacity:0;
      }

    }

    @keyframes fadeIn{

      from{
        opacity:0;
        transform:translateY(30px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }

    @media(max-width:700px){

      h1{
        font-size:2rem;
      }

      .subtitle{
        font-size:1rem;
      }

      .timer{
        font-size:1.1rem;
      }

      .quote{
        font-size:0.95rem;
      }

      .card{
        padding:25px;
      }

    }

  </style>

</head>

<body>

  <div class="card">

    <h1>❤️ Feliz 2 Anos ❤️</h1>

    <p class="subtitle" id="subtitle">
      Dois anos vivendo os melhores momentos da minha vida ao seu lado 💜
    </p>

    <div class="timer" id="timer"></div>

    <div class="quote" id="quote">
      Carregando universo do nosso dia...
    </div>

    <button onclick="loadNASA()">
      Ver Universo do Nosso Dia 🌌
    </button>

  </div>

  <script>

    // =========================================
    // DATA DO NAMORO
    // =========================================

    const startDate = new Date('2024-05-06');

    // =========================================
    // CONTADOR
    // =========================================

    function updateTimer(){

      const now = new Date();

      const diff = now - startDate;

      const days = Math.floor(
        diff / (1000 * 60 * 60 * 24)
      );

      const hours = Math.floor(
        (diff / (1000 * 60 * 60)) % 24
      );

      const minutes = Math.floor(
        (diff / (1000 * 60)) % 60
      );

      const seconds = Math.floor(
        (diff / 1000) % 60
      );

      document.getElementById('timer').innerHTML = `

        Estamos juntos há ❤️<br><br>

        ${days} dias<br>
        ${hours} horas<br>
        ${minutes} minutos<br>
        ${seconds} segundos

      `;

    }

    setInterval(updateTimer, 1000);

    updateTimer();

    // =========================================
    // DATA DA NASA
    // =========================================

    const nasaDate = '2024-05-06';

    // =========================================
    // NASA APOD
    // =========================================

    async function loadNASA(){

      try{

        const response = await fetch(

          `https://api.nasa.gov/planetary/apod?api_key=Hjl5ZWDhnopXInpc0GyaJe5JrGfKbAXOXYCOCxmY&date=${nasaDate}`

        );

        const data = await response.json();

        document.getElementById('quote').innerHTML = `

          <div style="margin-top:20px">

            <img
              class="nasa-image"
              src="${data.hdurl || data.url}"
              alt="Imagem NASA"
            >

            <h2 style="
              margin-bottom:10px;
              font-size:1.6rem;
            ">
              🌌 ${data.title}
            </h2>

            <p style="
              opacity:0.8;
              margin-bottom:15px;
              font-size:0.95rem;
            ">
              📅 ${data.date}
            </p>

            <p style="
              line-height:1.9;
              font-size:1rem;
              text-align:left;
            ">
              ${data.explanation}
            </p>

          </div>

        `;

      }catch(error){

        console.log(error);

        document.getElementById('quote').innerHTML = `
          Nosso amor é maior que o universo 💜
        `;

      }

    }

    loadNASA();

    // =========================================
    // HORÁRIO EM TEMPO REAL
    // =========================================

    async function loadTimeZone(){

      try{

        const response = await fetch(
          'https://worldtimeapi.org/api/timezone/America/Sao_Paulo'
        );

        const data = await response.json();

        const date = new Date(data.datetime);

        document.getElementById('subtitle').innerHTML = `

          Dois anos vivendo os melhores momentos da minha vida ao seu lado 💜

          <br><br>

          Hoje é ${date.toLocaleDateString('pt-BR')}

        `;

      }catch(error){

        console.log(error);

      }

    }

    loadTimeZone();

    // =========================================
    // SLIDESHOW DE FOTOS
    // =========================================

    const photos = [

      './img/00.jpg',
      './img/01.jpg',
      './img/02.jpg',
      './img/03.jpg',
      './img/04.jpg',
      './img/05.jpg',
      './img/06.jpg',
      './img/07.jpg',
      './img/08.jpg',
      './img/09.jpg',
      './img/10.jpg',
      './img/11.jpg'

    ];

    let currentPhoto = 0;

    function changeBackground(){

      document.body.style.backgroundImage = `

        linear-gradient(
          rgba(20,0,40,0.7),
          rgba(20,0,40,0.7)
        ),

        url('${photos[currentPhoto]}')

      `;

      document.body.style.backgroundSize = 'cover';

      document.body.style.backgroundPosition = 'center';

      currentPhoto++;

      if(currentPhoto >= photos.length){

        currentPhoto = 0;

      }

    }

    changeBackground();

    setInterval(changeBackground, 5000);

    // =========================================
    // CORAÇÕES
    // =========================================

    function createHeart(){

      const heart = document.createElement('div');

      heart.classList.add('heart');

      heart.innerHTML = '❤';

      heart.style.left =
      Math.random() * 100 + 'vw';

      heart.style.animationDuration =
      (Math.random() * 4 + 4) + 's';

      heart.style.fontSize =
      (Math.random() * 20 + 10) + 'px';

      document.body.appendChild(heart);

      setTimeout(() => {

        heart.remove();

      }, 8000);

    }

    setInterval(createHeart, 300);

  </script>

</body>

</html>
