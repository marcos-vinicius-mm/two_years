<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>2 Anos ❤️</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --rose: #e8637a;
      --rose-light: #f9a8b8;
      --rose-dark: #c94560;
      --purple: #7c5cbf;
      --purple-light: #b39ddb;
      --bg-start: #1a0a2e;
      --bg-mid: #2d1254;
      --bg-end: #0d2158;
      --glass: rgba(255, 255, 255, 0.07);
      --glass-border: rgba(255, 255, 255, 0.15);
      --text: #f0eaff;
      --text-muted: rgba(240, 234, 255, 0.65);
    }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 45%, var(--bg-end) 100%);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      padding: 0 0 60px;
    }

    /* ── STARS BACKGROUND ── */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--d, 3s) ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.1; transform: scale(1); }
      to   { opacity: 0.9; transform: scale(1.3); }
    }

    /* ── FLOATING HEARTS ── */
    .heart-particle {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      animation: floatUp var(--dur, 7s) ease-in forwards;
      font-size: var(--size, 16px);
      opacity: 0;
    }
    @keyframes floatUp {
      0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.8; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(-120px) rotate(20deg); opacity: 0; }
    }

    /* ── LAYOUT ── */
    .container {
      position: relative;
      z-index: 2;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ── HERO ── */
    .hero {
      text-align: center;
      padding: 70px 20px 50px;
    }
    .hero-badge {
      display: inline-block;
      background: linear-gradient(135deg, var(--rose), var(--purple));
      border-radius: 100px;
      padding: 6px 22px;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(232, 99, 122, 0.4);
    }
    .hero h1 {
      font-size: clamp(2.4rem, 7vw, 4.2rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 30%, var(--rose-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 18px;
    }
    .hero-sub {
      font-size: 1.1rem;
      color: var(--text-muted);
      line-height: 1.7;
      max-width: 520px;
      margin: 0 auto 40px;
    }

    /* ── TIMER ── */
    .timer-grid {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .timer-cell {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 18px 24px;
      min-width: 90px;
      text-align: center;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .timer-num {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, #fff, var(--rose-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .timer-label {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 6px;
    }
    .timer-date {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 14px;
    }

    /* ── CARD ── */
    .card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 36px;
      margin-bottom: 28px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      animation: fadeSlide 0.8s ease both;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-title {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-title span {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--rose), var(--purple));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    /* ── NASA ── */
    #nasa-img {
      width: 100%;
      border-radius: 16px;
      max-height: 480px;
      object-fit: cover;
      margin-bottom: 20px;
      display: none;
    }
    #nasa-img.loaded { display: block; }
    .nasa-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .nasa-heading {
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 6px;
    }
    .pill {
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--glass-border);
      border-radius: 100px;
      padding: 3px 12px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .nasa-text {
      font-size: 0.95rem;
      line-height: 1.85;
      color: var(--text-muted);
    }
    .nasa-skeleton {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .skeleton-block {
      background: rgba(255,255,255,0.06);
      border-radius: 10px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50%       { opacity: 1; }
    }

    /* ── GALLERY ── */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .gallery-item {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 4/5;
      cursor: pointer;
      background: rgba(255,255,255,0.05);
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s cubic-bezier(.4,0,.2,1);
      display: block;
    }
    .gallery-item:hover img { transform: scale(1.07); }
    .gallery-item::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.35) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .gallery-item:hover::after { opacity: 1; }

    /* ── LIGHTBOX ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.92);
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 92vw;
      max-height: 88vh;
      border-radius: 12px;
      object-fit: contain;
      box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    }
    .lightbox-close {
      position: fixed;
      top: 20px; right: 24px;
      font-size: 2rem;
      cursor: pointer;
      color: white;
      line-height: 1;
      opacity: 0.7;
      transition: opacity 0.2s;
      background: none; border: none;
      font-family: inherit;
    }
    .lightbox-close:hover { opacity: 1; }

    /* ── DIVIDER ── */
    .divider {
      text-align: center;
      font-size: 1.4rem;
      margin: 8px 0 28px;
      opacity: 0.3;
      letter-spacing: 8px;
    }

    @media (max-width: 600px) {
      .card { padding: 22px 18px; }
      .timer-cell { padding: 14px 16px; min-width: 70px; }
      .timer-num { font-size: 1.7rem; }
      .gallery { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- Stars -->
  <div class="stars" id="stars"></div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lb-close">×</button>
    <img id="lb-img" src="" alt="">
  </div>

  <div class="container">

    <!-- HERO -->
    <div class="hero">
      <div class="hero-badge">💜 06 de maio de 2024</div>
      <h1>Feliz<br>2 Anos, Amor</h1>
      <p class="hero-sub">Dois anos dos melhores momentos da minha vida. Cada dia ao seu lado é a prova de que a vida fica mais bonita quando você está nela.</p>

      <div class="timer-grid">
        <div class="timer-cell">
          <div class="timer-num" id="t-days">—</div>
          <div class="timer-label">Dias</div>
        </div>
        <div class="timer-cell">
          <div class="timer-num" id="t-hours">—</div>
          <div class="timer-label">Horas</div>
        </div>
        <div class="timer-cell">
          <div class="timer-num" id="t-min">—</div>
          <div class="timer-label">Minutos</div>
        </div>
        <div class="timer-cell">
          <div class="timer-num" id="t-sec">—</div>
          <div class="timer-label">Segundos</div>
        </div>
      </div>
      <p class="timer-date" id="today-date"></p>
    </div>

    <!-- NASA CARD -->
    <div class="card" style="animation-delay: 0.1s">
      <div class="card-title">
        <span>🌌</span>
        O universo no nosso dia
      </div>

      <!-- Skeleton while loading -->
      <div class="nasa-skeleton" id="nasa-skeleton">
        <div class="skeleton-block" style="height: 300px; border-radius: 14px;"></div>
        <div class="skeleton-block" style="height: 22px; width: 60%;"></div>
        <div class="skeleton-block" style="height: 14px; width: 40%;"></div>
        <div class="skeleton-block" style="height: 80px;"></div>
      </div>

      <div id="nasa-content" style="display:none">
        <img id="nasa-img" alt="Foto da NASA">
        <div id="nasa-video-wrap" style="display:none; margin-bottom:18px;">
          <a id="nasa-video-link" href="#" target="_blank"
             style="display:inline-block; background: linear-gradient(135deg,#e8637a,#7c5cbf); border-radius:12px; padding:12px 22px; color:#fff; text-decoration:none; font-weight:600; font-size:0.95rem;">
            ▶ Assistir no YouTube
          </a>
        </div>
        <div class="nasa-meta">
          <p class="nasa-heading" id="nasa-title"></p>
        </div>
        <div style="display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;">
          <span class="pill" id="nasa-date"></span>
          <span class="pill" id="nasa-copy"></span>
        </div>
        <p class="nasa-text" id="nasa-desc"></p>
      </div>
    </div>

    <!-- GALLERY CARD -->
    <div class="card" style="animation-delay: 0.2s">
      <div class="card-title">
        <span>📸</span>
        Nossos momentos
      </div>
      <div class="gallery" id="gallery"></div>
    </div>

  </div>

  <!-- Lightbox logic & particles -->
  <script>
    // ── STARS ──
    (function() {
      const c = document.getElementById('stars');
      for (let i = 0; i < 140; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() * 2.2 + 0.5;
        s.style.cssText = `
          width:${size}px; height:${size}px;
          top:${Math.random()*100}%;
          left:${Math.random()*100}%;
          --d:${(Math.random()*3+2).toFixed(1)}s;
          animation-delay:${(Math.random()*4).toFixed(1)}s;
        `;
        c.appendChild(s);
      }
    })();

    // ── TIMER ──
    const startDate = new Date('2024-05-06T00:00:00');
    function pad(n){ return String(n).padStart(2,'0'); }
    function tick(){
      const diff = Date.now() - startDate;
      document.getElementById('t-days').textContent  = Math.floor(diff / 86400000);
      document.getElementById('t-hours').textContent = pad(Math.floor((diff / 3600000) % 24));
      document.getElementById('t-min').textContent   = pad(Math.floor((diff / 60000) % 60));
      document.getElementById('t-sec').textContent   = pad(Math.floor((diff / 1000) % 60));
    }
    tick(); setInterval(tick, 1000);

    // Today's date in pt-BR
    document.getElementById('today-date').textContent =
      'Hoje é ' + new Date().toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

    // ── TRADUÇÃO VIA CLAUDE API ──
    async function translate(title, explanation) {
      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 1000,
            messages: [{
              role: 'user',
              content: 'Traduza o título e a descrição abaixo para o português brasileiro de forma natural e fluida. Responda APENAS com JSON no formato {"titulo":"...","descricao":"..."} sem mais nada.\n\nTÍTULO: ' + title + '\n\nDESCRIÇÃO: ' + explanation
            }]
          })
        });
        if (!res.ok) return null;
        const d = await res.json();
        const text = (d.content || []).map(b => b.text || '').join('');
        const clean = text.replace(/```json|```/g, '').trim();
        return JSON.parse(clean);
      } catch(e) { return null; }
    }

    // ── NASA APOD ──
    async function loadNASA() {
      const DATE = '2024-05-06';
      const KEYS = ['Hjl5ZWDhnopXInpc0GyaJe5JrGfKbAXOXYCOCxmY', 'DEMO_KEY'];
      let data = null;
      for (const KEY of KEYS) {
        try {
          const r = await fetch('https://api.nasa.gov/planetary/apod?api_key=' + KEY + '&date=' + DATE);
          if (!r.ok) continue;
          const d = await r.json();
          if (d && !d.error) { data = d; break; }
        } catch(e) {}
      }

      try {
        if (!data) throw new Error('sem dados');

        // Mostra conteúdo em inglês imediatamente enquanto traduz
        document.getElementById('nasa-skeleton').style.display = 'none';
        document.getElementById('nasa-content').style.display  = 'block';

        document.getElementById('nasa-title').textContent = data.title || '';
        document.getElementById('nasa-date').textContent  = '📅 ' + (data.date || DATE);
        document.getElementById('nasa-copy').textContent  = data.copyright ? '© ' + data.copyright.trim() : 'NASA / Public Domain';
        document.getElementById('nasa-desc').textContent  = data.explanation || '';

        if (data.media_type === 'image') {
          const img = document.getElementById('nasa-img');
          img.src = data.hdurl || data.url;
          img.onload = () => img.classList.add('loaded');
        } else if (data.media_type === 'video') {
          const wrap = document.getElementById('nasa-video-wrap');
          wrap.style.display = 'block';
          document.getElementById('nasa-video-link').href = data.url;
        }

        // Inicia tradução em paralelo — atualiza quando chegar
        if (data.title || data.explanation) {
          document.getElementById('nasa-title').style.opacity = '0.5';
          document.getElementById('nasa-desc').style.opacity  = '0.5';
          const translated = await translate(data.title || '', data.explanation || '');
          if (translated) {
            if (translated.titulo) {
              document.getElementById('nasa-title').textContent = translated.titulo;
              document.getElementById('nasa-title').style.opacity = '1';
            }
            if (translated.descricao) {
              document.getElementById('nasa-desc').textContent = translated.descricao;
              document.getElementById('nasa-desc').style.opacity = '1';
            }
          } else {
            document.getElementById('nasa-title').style.opacity = '1';
            document.getElementById('nasa-desc').style.opacity  = '1';
          }
        }

      } catch (err) {
        document.getElementById('nasa-skeleton').innerHTML = `
          <p style="color:rgba(255,255,255,0.5); font-size:0.95rem; text-align:center; padding:20px 0;">
            Não foi possível carregar a imagem da NASA para esta data.<br>
            <small>Você pode conferir em <a href="https://apod.nasa.gov" target="_blank" style="color:#b39ddb;">apod.nasa.gov</a></small>
          </p>`;
      }
    }
    loadNASA();

    // ── GALLERY ──
    const photos = [
      './img/00.jpg','./img/01.jpg','./img/02.jpg','./img/03.jpg',
      './img/04.jpg','./img/05.jpg','./img/06.jpg','./img/07.jpg',
      './img/08.jpg','./img/09.jpg','./img/10.jpg','./img/11.jpg',
    ];
    const gallery = document.getElementById('gallery');
    photos.forEach(src => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      const img = document.createElement('img');
      img.src = src;
      img.alt = '';
      img.loading = 'lazy';
      img.addEventListener('click', () => openLightbox(src));
      item.appendChild(img);
      gallery.appendChild(item);
    });

    // ── LIGHTBOX ──
    const lb    = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    function openLightbox(src) {
      lbImg.src = src;
      lb.classList.add('open');
    }
    document.getElementById('lb-close').addEventListener('click', () => lb.classList.remove('open'));
    lb.addEventListener('click', e => { if (e.target === lb) lb.classList.remove('open'); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('open'); });

    // ── FLOATING HEARTS ──
    const heartChars = ['❤', '💜', '🩷', '💕'];
    function spawnHeart() {
      const h = document.createElement('div');
      h.className = 'heart-particle';
      h.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];
      h.style.setProperty('--dur', (Math.random() * 4 + 5) + 's');
      h.style.setProperty('--size', (Math.random() * 14 + 10) + 'px');
      h.style.left = (Math.random() * 100) + 'vw';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 9000);
    }
    setInterval(spawnHeart, 400);
  </script>
</body>
</html>
